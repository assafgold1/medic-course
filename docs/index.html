<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5AE6">
<meta name="description" content="מסלול חובש: לימוד, תרגול ומבחנים לקורס חובשים">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>מסלול חובש</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: blue app bands on top, white rounded sheets that overlap them; cards in a 2-column grid */
:root{
  --band-a:#1D5AE6; --band-b:#4C8BF8; --blue:#0A4FD6; --blue-deep:#0B33A8; --blue-soft:#E7EFFE;
  --paper:#EEF3FB; --surface:#FFFFFF; --ink:#16213A; --muted:#66728A; --line:#BFD2F7; --hair:#E3EAF6;
  --good:#16A34A; --good-soft:#E3F6EA; --mid:#E39A0B; --mid-soft:#FDF2DC; --bad:#D92D2D; --bad-soft:#FBE4E4;
  --on-band:#FFFFFF; --band-ink:rgba(255,255,255,.82);
  --f:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band-a:#123A9C; --band-b:#2A62D6; --blue:#4D86FF; --blue-deep:#9FC0FF; --blue-soft:#17264A;
  --paper:#0A1120; --surface:#131C2F; --ink:#E7EDF8; --muted:#97A3BA; --line:#2C3F66; --hair:#22304D;
  --good:#3DD47A; --good-soft:#123523; --mid:#F2B73F; --mid-soft:#3A2C0E; --bad:#FF6B6B; --bad-soft:#3D1717; color-scheme:dark}}
:root[data-theme="dark"]{
  --band-a:#123A9C; --band-b:#2A62D6; --blue:#4D86FF; --blue-deep:#9FC0FF; --blue-soft:#17264A;
  --paper:#0A1120; --surface:#131C2F; --ink:#E7EDF8; --muted:#97A3BA; --line:#2C3F66; --hair:#22304D;
  --good:#3DD47A; --good-soft:#123523; --mid:#F2B73F; --mid-soft:#3A2C0E; --bad:#FF6B6B; --bad-soft:#3D1717; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f);font-size:16.5px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--band-a)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;font-weight:700}
h1{font-size:clamp(26px,6vw,34px);font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:18px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.in{max-width:820px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}

/* bands */
.band{background:linear-gradient(160deg,var(--band-a),var(--band-b));color:var(--on-band)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(10,40,120,.18)}
.appbar .in{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:62px}
.appbar h1{font-size:19px;font-weight:700;text-align:center;color:var(--on-band)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none}
.icon-btn svg{width:22px;height:22px}
.sheet{max-width:820px;margin:18px auto 0;background:var(--surface);border-radius:28px 28px 0 0;padding:24px var(--gutr) 90px var(--gut);min-height:70vh;box-shadow:0 -4px 24px rgba(10,40,120,.06)}
.sheet.lift{margin-top:-34px;position:relative}

/* home hero */
.hero .in{padding-top:18px;padding-bottom:58px;display:grid;gap:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.brand .mark svg{width:28px;height:28px}
.brand b{font-size:22px;font-weight:800}
.brand nav{margin-inline-start:auto;display:flex;gap:8px}
.score-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .t{stroke:rgba(255,255,255,.22)} .ring .v{stroke:#fff;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
.score-row p{margin:2px 0 0;color:var(--band-ink);font-size:15px}
.hero-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbtn{border-radius:16px;padding:14px 12px;font-weight:700;font-size:16px;text-align:center;text-decoration:none;border:2px solid rgba(255,255,255,.7);color:#fff;display:flex;flex-direction:column;gap:2px;align-items:center}
.hbtn small{font-weight:500;font-size:12.5px;opacity:.85}
.hbtn.solid{background:#fff;color:var(--blue);border-color:#fff}
.hbtn.solid small{color:var(--muted)}

/* shared */
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.search{width:100%;font:inherit;padding:13px 16px;border-radius:14px;border:1.5px solid var(--hair);background:var(--paper);color:var(--ink)}
.search:focus{outline:none;border-color:var(--blue)}
.btn{border:0;border-radius:16px;padding:15px 20px;font-weight:700;font-size:17px;background:var(--blue);color:#fff;text-align:center;text-decoration:none;display:inline-block}
.btn.wide{width:100%;display:block}
.btn.red{background:var(--blue);color:#fff}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.empty{padding:24px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.foot{margin-top:34px;font-size:13.5px;color:var(--muted);max-width:66ch}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.good{color:var(--good)} .mid{color:var(--mid)} .low{color:var(--bad)}
.pill.good{background:var(--good-soft)} .pill.mid{background:var(--mid-soft)} .pill.low{background:var(--bad-soft)} .pill.none{background:var(--paper);color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bar i.good{background:var(--good)} .bar i.mid{background:var(--mid)} .bar i.low{background:var(--bad)}

/* home topic list */
.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ghead .ic{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.ghead .ic svg{width:20px;height:20px}
.ghead h2{font-size:18px}
.ghead .pill{margin-inline-start:auto}
.topics{display:grid;gap:8px}
.topic{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1.5px solid var(--hair);background:var(--surface);text-decoration:none;color:var(--ink)}
.topic:hover{border-color:var(--line)}
.topic .n{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.topic b{display:block;font-size:16.5px;font-weight:600;line-height:1.3}
.topic span.d{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;min-width:0}
.topic .t{min-width:0}

/* category picker */
.pick-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;font-size:15px;padding:6px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{position:relative;text-align:start;border-radius:20px;border:2px solid var(--line);background:var(--surface);padding:16px 16px 14px;display:grid;gap:10px;min-width:0}
.cat.off{border-color:var(--hair);opacity:.62}
.cat .top{display:flex;justify-content:space-between;align-items:flex-start}
.cat .ic{color:var(--ink)} .cat .ic svg{width:34px;height:34px}
.cat .chk{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff}
.cat.off .chk{background:var(--surface);border:2px solid var(--line)}
.cat.off .chk svg{visibility:hidden}
.cat .chk svg{width:18px;height:18px}
.cat .nm{font-size:16px;font-weight:500;color:var(--ink);line-height:1.3;min-height:2.6em}
.cat .pc{font-size:26px;font-weight:800;line-height:1}
.cat .sub{font-size:12.5px;color:var(--muted)}
.opt-row{margin-top:22px;display:grid;gap:8px}
.seg{display:flex;gap:4px;padding:4px;background:var(--paper);border-radius:14px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:none;padding:9px 10px;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 4px rgba(10,40,120,.12)}
.sticky-go{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:22px}
.hist{margin-top:28px;display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--paper);font-size:14.5px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:14px}
.qchip{background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:13px;padding:4px 10px;border-radius:99px}
.qtext{font-size:20px;font-weight:600;line-height:1.5;margin:14px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:start;padding:14px 16px;border-radius:16px;border:2px solid var(--hair);background:var(--surface);display:flex;gap:12px;align-items:flex-start;line-height:1.45;font-size:16.5px}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--paper);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:14px}
.opt:not(:disabled):hover{border-color:var(--line)}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.opt.picked .k{background:var(--blue);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.explain{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--paper);font-size:15.5px}
.explain b{display:block;margin-bottom:2px}

/* results */
.radar{display:block;width:100%;max-width:440px;margin:0 auto}
.res-head .in{padding-bottom:50px}
.verdict{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.verdict .v{font-size:40px;font-weight:800;line-height:1}
.verdict .p{font-size:30px;font-weight:600}
.split{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:16px 0 10px;background:var(--hair)}
.split i{display:block;height:100%}
.counts{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.counts b{color:var(--ink);font-size:20px;font-weight:800}
.by{margin-top:24px}
.by h3{text-align:center;font-weight:500;font-size:17px;margin-bottom:12px}
.bygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bybtn{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 10px;font-weight:700;font-size:17px;color:var(--blue);display:grid;gap:2px;justify-items:center;min-width:0}
.bybtn small{font-weight:500;font-size:13px;color:var(--muted)}
.review{margin-top:18px;display:grid;gap:10px}
.rv{padding:14px 16px;border-radius:16px;border:1.5px solid var(--hair);font-size:15px;display:grid;gap:4px}
.rv .q{font-weight:600}
.rv .a{color:var(--good);font-weight:600}
.rv .w{color:var(--bad);text-decoration:line-through}
.rv .e{color:var(--muted)}

/* topic */
.tabs{display:flex;gap:4px;padding:4px;background:var(--paper);border-radius:14px;margin:4px 0 18px}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 4px rgba(10,40,120,.12)}
.callout{margin:0 0 16px;padding:12px 14px;border-radius:14px;background:var(--mid-soft);font-size:15px;border-inline-start:4px solid var(--mid)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.num{padding:11px 13px;border-radius:14px;background:var(--blue-soft);min-width:0}
.num b{display:block;font-family:var(--mono);font-size:18px;color:var(--blue);line-height:1.3}
.num span{font-size:13.5px;color:var(--muted);line-height:1.35;display:block}
.sec{padding-block:16px;border-bottom:1px solid var(--hair)}
.sec:last-of-type{border-bottom:0}
.sec h3{margin-bottom:8px;color:var(--blue-deep)}
:root:not([data-theme="dark"]) .sec h3{color:var(--blue)}
.sec ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.sec li{max-width:70ch}
.sec ol{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.sec ol li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.sec ol li::before{content:counter(s);font-size:13px;font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin-top:1px}
.thead{display:grid;gap:6px;margin-bottom:12px}

/* flashcards (reused) */
.card{perspective:1200px;margin:6px 0 14px}
.card-in{position:relative;min-height:270px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:2px solid var(--line);background:var(--surface);padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--band-a),var(--band-b));color:#fff;border-color:transparent}
.face .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.75}
.face .main{font-size:20px;font-weight:600;line-height:1.45}
.face .sub{font-size:15.5px;opacity:.9}
.fc-ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.result{text-align:center;padding-block:20px 8px;display:grid;gap:8px;justify-items:center}
.big{font-family:var(--mono);font-size:54px;line-height:1;font-weight:600}
@media (prefers-reduced-motion:reduce){.card-in{transition:none}}

/* metronome (reused) */
.met{display:grid;gap:18px}
.dial{position:relative;width:min(290px,78vw);aspect-ratio:1;max-width:100%;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line)}
.dial.beat{animation:beat .16s ease-out}
@keyframes beat{0%{transform:scale(.965);border-color:var(--blue)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dial.beat{animation:none}}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:8}
.dial .trk{stroke:var(--hair)} .dial .prog{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .12s}
.dial.breath .prog{stroke:var(--good)}
.dial-c{text-align:center;display:grid;gap:2px;position:relative}
.dial-c .cnt{font-family:var(--mono);font-size:74px;line-height:1;font-weight:600}
.dial-c .ph{font-weight:600;color:var(--muted)}
.dial.breath .cnt{color:var(--good)}
.row{display:grid;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:14px;background:var(--paper);text-align:center;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.alarm{padding:14px;border-radius:14px;background:var(--bad);color:#fff;font-weight:800;text-align:center;font-size:18px}

/* tables (reused) */
.tbl{overflow-x:auto;border:1.5px solid var(--hair);border-radius:16px;background:var(--surface);margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--hair);vertical-align:top}
thead th{font-size:13px;color:var(--muted);background:var(--paper)}
tbody th{font-weight:600}
tr:last-child td,tr:last-child th{border-bottom:0}
td .mono{color:var(--blue)}

@media (max-width:520px){
  .qtext{font-size:18.5px}
  .cat{padding:14px 12px 12px}
  .cat .pc{font-size:23px}
  .verdict .v{font-size:34px}
}
</style>
<div id="app" dir="rtl" lang="he"></div>

<script>

/* ===================== CONTENT ===================== */
/* quiz item: [question, [correct, wrong, wrong, wrong], explanation] — options are shuffled at render */
const TOPICS = [
{ id:'neuro', cat:'anat', title:'מערכת העצבים', blurb:'CNS ו-PNS, חלקי המוח, חוט השדרה, המערכת האוטונומית והנוירון',
  nums:[['4','חלקי ה-CNS'],['4','אונות בכל המיספרה'],['12','עצבי גולגולת'],['31','זוגות עצבי שדרה'],['X','עצב הוואגוס']],
  learn:[
    {h:'מבוא',items:[
      'מערכת העצבים מווסתת את רוב פעולות הגוף, בעזרת דחפים חשמליים.',
      'תאי העצב רגישים מאוד להיפוקסיה. נזק להם בגלל מחסור בחמצן הוא בלתי הפיך.']},
    {h:'החלוקה',items:[
      'מערכת העצבים המרכזית (CNS): המוח וחוט השדרה.',
      'מערכת העצבים ההיקפית (PNS): רצונית (סומטית), ובלתי רצונית (אוטונומית) שמתחלקת לסימפתטית ולפאראסימפתטית.']},
    {h:'המוח',items:[
      'ממלא את חלל הגולגולת. מוגן על ידי קרומי המוח, נוזל השדרה, הגולגולת, הקרקפת והשיער.',
      'מחולק לארבעה: המוח הגדול, המוח הקטן, גזע המוח וחוט השדרה.',
      'המוח הגדול: שני חצאים, ובכל אחד ארבע אונות: מצחית, קודקודית, רקתית ועורפית.',
      'המוח הקטן: בחלק האחורי-תחתון של הגולגולת. שיווי משקל, קואורדינציה (תיאום ועידון תנועות) וטונוס שרירים.']},
    {h:'גזע המוח',items:[
      'מוח תיכון (Midbrain), גשר (Pons) ומוח מוארך (Medulla oblongata).',
      'תפקידים: מרכז הנשימה, פיקוד על לחץ הדם ועל קצב הלב, ויסות רמת הגלוקוז וחום הגוף, רפלקס הראייה, תחושות ופיקוח על ההפרשה הפנימית.']},

const store = {

/* ===================== DATA HELPERS ===================== */
const $app = document.getElementById('app');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const LETTERS = ['א','ב','ג','ד'];
const ALLQ = TOPICS.flatMap(t => t.quiz.map((q,i)=>({id:t.id+'#'+i, topic:t.id, cat:t.cat, q:q[0], opts:q[1], e:q[2]})));
const topicById = id => TOPICS.find(t=>t.id===id);
const catQ = c => ALLQ.filter(q=>q.cat===c);
const pctOf = list => list.length ? Math.round(list.filter(q=>qstate[q.id]===1).length/list.length*100) : 0;
const mastery = c => pctOf(catQ(c));
const tone = p => p>=80?'good':p>=50?'mid':'low';
const mistakesList = () => ALLQ.filter(q=>qstate[q.id]===0);
function saveQ(){ store.set('qstate', qstate) }
/* pick n questions spread evenly over the chosen categories */
function pickQs(cats, n, onlyWrong){
  let pools = cats.map(c=>shuffle(catQ(c).filter(q=>!onlyWrong || qstate[q.id]===0))).filter(p=>p.length);
  const out=[]; let i=0;
  while(out.length<n && pools.some(p=>p.length)){ const p=pools[i%pools.length]; if(p.length) out.push(p.pop()); i++; }
  return shuffle(out);
}

/* ===================== ROUTER ===================== */
let cleanup = null;
function route(){
  if (cleanup){ cleanup(); cleanup=null }
  const h = (location.hash||'').replace('#','') || 'home';
  if (h==='home') renderHome();
  else if (h==='practice') renderPicker();
  else if (h==='exam') startQuiz(pickQs(GROUP_ORDER, 30), {title:'מבחן מסכם', back:'home', kind:'exam', cats:GROUP_ORDER, instant:false});
  else if (h==='mistakes') startQuiz(shuffle(mistakesList()).slice(0,50), {title:'תרגול טעויות', back:'practice', kind:'mistakes', cats:GROUP_ORDER, instant:true});
  else if (h==='cpr-metronome') renderMetronome();
  else if (h==='numbers') renderNumbers();
  else if (topicById(h)) renderTopic(h, 'learn');
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ===================== QUIZ ===================== */
function startQuiz(qs, opt){
  if (!opt.mount){ $app.innerHTML = appbar(opt.title, opt.back) + `<main class="sheet"><div id="qz"></div></main>` }
  else opt.mount.innerHTML = `<div id="qz"></div>`;
  const box = (opt.mount||$app).querySelector('#qz');
  if (!qs.length){ box.innerHTML = `<div class="empty">אין כרגע שאלות לתרגול כאן. כל הכבוד!</div>`; return }
  const items = qs.map(q=>({...q, order:shuffle([0,1,2,3])}));
  let i=0; const log=[];
  function draw(){
    if (i>=items.length) return finish();
    const it = items[i];
    box.innerHTML = `
      <div class="qhead"><span>שאלה <span class="mono">${i+1}/${items.length}</span></span><span class="qchip">${opt.kind==='topic'?CATS[it.cat]:topicById(it.topic).title}</span></div>
      ${barHTML(Math.round(i/items.length*100)).replace(/class="(good|mid|low)"/,'style="background:var(--blue)" class=""')}
      <p class="qtext">${it.q}</p>
      <div class="opts">${it.order.map((o,k)=>`<button class="opt" data-o="${o}"><span class="k">${LETTERS[k]}</span><span>${it.opts[o]}</span></button>`).join('')}</div>
      <div id="after"></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(it,+b.dataset.o));
  }
  function answer(it,o){
    const ok=o===0; log.push({it,o,ok}); qstate[it.id]=ok?1:0; saveQ();
    box.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const v=+b.dataset.o;
      if(opt.instant){ if(v===0) b.classList.add('right'); else if(v===o) b.classList.add('wrong') }
      else if(v===o) b.classList.add('picked'); });
    const after=box.querySelector('#after');
    if (opt.instant){
      after.innerHTML = `<div class="explain"><b class="${ok?'good':'low'}">${ok?'נכון':'לא נכון'}</b>${it.e}</div>
        <div class="cta"><button class="btn wide" id="next">${i+1<items.length?'השאלה הבאה':'לתוצאות'}</button></div>`;
      const n=after.querySelector('#next'); n.focus({preventScroll:true}); n.onclick=()=>{i++;draw()};
    } else setTimeout(()=>{i++;draw()}, 380);
  }
  function finish(){
    const right=log.filter(l=>l.ok).length, pct=Math.round(right/log.length*100);
    if (opt.kind==='topic'){ best[opt.topic]=Math.max(best[opt.topic]||0,pct); store.set('best2',best) }
    if (opt.kind!=='topic'){
      const d=new Date(); hist.unshift({title:opt.title, date:`${d.getDate()}.${d.getMonth()+1}`, n:log.length, right, pct}); hist=hist.slice(0,20); store.set('history',hist);
    }
    renderResults(log, opt);
  }
  draw();
}

/* ===================== RESULTS ===================== */
function radarSVG(cats, vals){
  const W=400,H=300,cx=200,cy=150,R=100,n=cats.length;
  const pt=(k,r)=>{ const a=-Math.PI/2 + k*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)] };
  const poly=r=>cats.map((_,k)=>pt(k,typeof r==='function'?r(k):r).map(v=>v.toFixed(1)).join(',')).join(' ');
  const axes=cats.map((_,k)=>{const [x,y]=pt(k,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.55)" stroke-width="1"/>`}).join('');
  const labels=cats.map((c,k)=>{ const [x,y]=pt(k,R+22); const anchor=Math.abs(x-cx)<20?'middle':(x<cx?'end':'start');
    return `<text x="${x}" y="${y+5}" text-anchor="${anchor}" fill="#fff" font-size="14" font-weight="600" font-family="Rubik, sans-serif">${SHORT[c]}</text>` }).join('');
  return `<svg class="radar" style="direction:ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="ציון לפי קטגוריה">
    <polygon points="${poly(R)}" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
    <polygon points="${poly(R/2)}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
    ${axes}
    <polygon points="${poly(k=>Math.max(4,R*vals[k]/100))}" fill="rgba(11,51,168,.55)" stroke="#0B2E9A" stroke-width="4" stroke-linejoin="round"/>
    ${labels}</svg>`;
}
function renderResults(log, opt){
  const right=log.filter(l=>l.ok).length, wrong=log.length-right, pct=Math.round(right/log.length*100), pass=pct>=PASS;
  const cats=GROUP_ORDER.filter(c=>log.some(l=>l.it.cat===c));
  const by={}; cats.forEach(c=>{ const L=log.filter(l=>l.it.cat===c); by[c]={r:L.filter(l=>l.ok).length,n:L.length} });
  const vals=cats.map(c=>Math.round(by[c].r/by[c].n*100));
  const chart = cats.length>=3 ? radarSVG(cats,vals)
    : `<div style="display:grid;gap:12px;padding:10px 0">${cats.map((c,k)=>`<div><div style="display:flex;justify-content:space-between;font-weight:600"><span>${CATS[c]}</span><span class="mono">${vals[k]}%</span></div><div class="bar" style="background:rgba(255,255,255,.25)"><i style="width:${vals[k]}%;background:#fff"></i></div></div>`).join('')}</div>`;
  const back = opt.kind==='topic' ? opt.topic : opt.back;
  $app.innerHTML = `
    <header class="band res-head" style="border-radius:0"><div class="in">
      <div style="display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:62px">
        <a class="icon-btn bk" href="#${back}" aria-label="חזרה">${CHEV}</a><h1 style="font-size:19px;text-align:center">${opt.title}</h1><span></span></div>
      ${chart}
    </div></header>
    <main class="sheet lift">
      <div class="verdict"><span class="v ${pass?'good':'low'}">${pass?'עברת':'נכשלת'}</span><span class="p ${pass?'good':'low'}"><span class="mono">${pct}%</span> הצלחה</span></div>
      <div class="split"><i style="width:${pct}%;background:var(--good)"></i><i style="width:${100-pct}%;background:var(--bad)"></i></div>
      <div class="counts"><span><b class="mono">${right}</b> תשובות נכונות</span><span><b class="mono">${wrong}</b> טעויות</span></div>
      <p class="lede" style="font-size:14px">ציון עובר: <span class="mono">${PASS}%</span></p>
      <section class="by"><h3>צפייה בתשובות לפי קטגוריה</h3>
        <div class="bygrid">${cats.map(c=>`<button class="bybtn" data-c="${c}">${SHORT[c]}<small><span class="mono">${by[c].r}/${by[c].n}</span></small></button>`).join('')}</div></section>
      <div class="cta" style="flex-direction:column">
        ${wrong?`<button class="btn wide" id="seeWrong">צפייה בתשובות השגויות</button><button class="btn ghost wide" id="redo">תרגול חוזר על הטעויות</button>`:''}
        <a class="btn ghost wide" href="#practice">לבחירת קטגוריות</a>
      </div>
      <div class="review" id="rev"></div>
    </main>`;
  const rev=document.getElementById('rev');
  const show=(list,title)=>{ rev.innerHTML = `<h3 style="margin-top:8px">${title}</h3>` + (list.length? list.map(l=>`
      <div class="rv"><span class="q">${l.it.q}</span>${l.ok?'':`<span class="w">${l.it.opts[l.o]}</span>`}<span class="a">${l.it.opts[0]}</span><span class="e">${l.it.e}</span></div>`).join('') : '<div class="empty">אין שאלות להצגה.</div>');
    rev.scrollIntoView({behavior:'smooth',block:'start'}) };
  $app.querySelectorAll('.bybtn').forEach(b=>b.onclick=()=>show(log.filter(l=>l.it.cat===b.dataset.c), CATS[b.dataset.c]));
  const sw=document.getElementById('seeWrong'); if(sw) sw.onclick=()=>show(log.filter(l=>!l.ok),'התשובות השגויות');
  const rd=document.getElementById('redo'); if(rd) rd.onclick=()=>{ startQuiz(shuffle(log.filter(l=>!l.ok).map(l=>l.it)), {...opt, mount:null, title:'תרגול חוזר', kind:'practice', instant:true}); window.scrollTo(0,0) };
  window.scrollTo(0,0);
}

function renderCards(t, pane){
  let deck = shuffle(t.quiz.map(q=>({q:q[0], a:q[1][0], e:q[2]})));
  let i=0, known=0, again=[];
  function draw(){
    if (i>=deck.length){
      pane.innerHTML = `<div class="result"><span class="eyebrow">סיימת סבב</span><div class="big">${known}/${deck.length}</div><p class="lede">כרטיסים שסימנת "ידעתי".</p>
        <div class="cta" style="justify-content:center">${again.length?`<button class="btn red" id="fc-again">חזרה על ${again.length} שלא ידעתי</button>`:''}<button class="btn ghost" id="fc-all">סבב חדש מלא</button></div></div>`;
      const a=document.getElementById('fc-again'); if(a) a.onclick=()=>{deck=shuffle(again);again=[];i=0;known=0;draw()};
      document.getElementById('fc-all').onclick=()=>{deck=shuffle(deck.concat(again));again=[];i=0;known=0;draw()};
      return;
    }
    const c = deck[i];
    pane.innerHTML = `
      <div class="qhead"><span>כרטיס <span class="mono">${i+1}/${deck.length}</span></span><span>הקש על הכרטיס להפוך</span></div>
      <div class="card" id="fc" tabindex="0" role="button" aria-label="הפוך כרטיס">
        <div class="card-in">
          <div class="face"><span class="lbl">שאלה</span><div class="main">${c.q}</div></div>
          <div class="face back"><span class="lbl">תשובה</span><div class="main">${c.a}</div><div class="sub">${c.e}</div></div>
        </div>
      </div>
      <div class="fc-ctl">
        <button class="btn ghost" id="fc-no">עוד לא</button>
        <button class="btn" id="fc-flip">הפוך</button>
        <button class="btn red" id="fc-yes">ידעתי</button>
      </div>`;
    const card = document.getElementById('fc');
    const flip = ()=>card.classList.toggle('flip');
    card.onclick = flip; card.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()} };
    document.getElementById('fc-flip').onclick = flip;
    document.getElementById('fc-yes').onclick = ()=>{known++;i++;draw()};
    document.getElementById('fc-no').onclick = ()=>{again.push(c);i++;draw()};
  }
  draw();
}


function renderMetronome(){
  const st = {bpm: store.get('bpm',110), mode: store.get('mode','30:2'), running:false, n:0, phase:'comp', t0:0, cycleT0:0, cycles:0, total:0, to:null, clock:null, ctx:null, wake:null, alarmUntil:0, nextBeat:0, breathT:0};
  const C = 2*Math.PI*140;
  $app.innerHTML = appbar('מטרונום החייאה','home') + `<main class="sheet">
    <div class="thead">
      <p class="lede">ספירה קולית וחזותית לתרגול על בובה. כל 2 דקות מתקבלת התראה לניתוח קצב ולהחלפת מעסה.</p></div>
    <div class="met">
      <div class="dial" id="dial">
        <svg viewBox="0 0 300 300" aria-hidden="true"><circle class="trk" cx="150" cy="150" r="140"/><circle class="prog" id="prog" cx="150" cy="150" r="140" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="dial-c"><div class="cnt" id="cnt" aria-live="off">0</div><div class="ph" id="ph">מוכן</div></div>
      </div>
      <div id="alarm" hidden class="alarm">2 דקות: ניתוח קצב והחלפת מעסה</div>
      <div class="cta" style="justify-content:center;margin-top:0"><button class="btn red" id="go" style="min-width:150px">התחל</button><button class="btn ghost" id="reset">איפוס</button></div>
      <div class="stats">
        <div class="stat"><b id="s-time">0:00</b><span>זמן כולל</span></div>
        <div class="stat"><b id="s-cyc">0:00</b><span>מחזור נוכחי</span></div>
        <div class="stat"><b id="s-n">0</b><span>מחזורים של 2 דק׳</span></div>
      </div>
      <div class="row"><span class="eyebrow">מצב</span>
        <div class="seg" id="mode">${[['30:2','30:2 מבוגר / יחיד'],['15:2','15:2 ילד בזוג'],['cont','רציף + הנשמה כל 6 שנ׳']].map(([k,l])=>`<button data-m="${k}" class="${k===st.mode?'on':''}">${l}</button>`).join('')}</div></div>
      <div class="row"><span class="eyebrow">קצב (לדקה)</span>
        <div class="seg" id="bpm">${[100,110,120].map(b=>`<button data-b="${b}" class="${b===st.bpm?'on':''}"><span class="mono">${b}</span></button>`).join('')}</div></div>
    </div></main>`;
  const $ = id=>document.getElementById(id);
  const fmt = ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') };
  function tone(f, d=0.06, vol=0.25){
    if(!st.ctx) return;
    const o=st.ctx.createOscillator(), g=st.ctx.createGain();
    o.frequency.value=f; o.type='sine'; g.gain.setValueAtTime(vol, st.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, st.ctx.currentTime+d);
    o.connect(g).connect(st.ctx.destination); o.start(); o.stop(st.ctx.currentTime+d+0.02);
  }
  const target = ()=> st.mode==='30:2'?30: st.mode==='15:2'?15: 0;
  function paint(){
    const dial=$('dial'); if(!dial) return;
    const tg = target();
    dial.classList.toggle('breath', st.phase==='breath');
    if (st.phase==='breath'){ $('cnt').textContent = st.breathN; $('ph').textContent='הנשמה'; $('prog').style.strokeDashoffset = C*(1-st.breathN/2) }
    else { $('cnt').textContent = st.n; $('ph').textContent = st.running? (tg?`עיסויים מתוך ${tg}`:'עיסויים רציפים') : (st.n?'בהשהיה':'מוכן');
      $('prog').style.strokeDashoffset = tg? C*(1-st.n/tg) : C*(1-((st.n%20)/20)); }
  }
  function beat(){
    if(!st.running) return;
    const iv = 60000/st.bpm, now=performance.now();
    const tg = target();
    if (st.phase==='comp'){
      st.n++; st.total++;
      tone(st.n===tg? 660 : st.n===1? 990 : 880, 0.05);
      const d=$('dial'); if(d){ d.classList.remove('beat'); void d.offsetWidth; d.classList.add('beat') }
      if (st.mode==='cont' && now-st.breathT>=6000){ st.breathT=now; tone(440,0.35,0.2) }
      if (tg && st.n>=tg){ st.phase='breath'; st.breathN=0; paint();
        st.nextBeat += iv; st.to=setTimeout(breaths, Math.max(0, st.nextBeat-performance.now())); return; }
    }
    paint();
    st.nextBeat += iv;
    st.to = setTimeout(beat, Math.max(0, st.nextBeat-performance.now()));
  }
  function breaths(){
    if(!st.running) return;
    st.breathN++; tone(523,0.6,0.22); paint();
    if (st.breathN<2){ st.to=setTimeout(breaths, 1800); return }
    st.to=setTimeout(()=>{ if(!st.running) return; st.phase='comp'; st.n=0; st.nextBeat=performance.now(); beat() }, 1800);
  }
  function clock(){
    const now=performance.now();
    if (st.running){
      const cyc = now-st.cycleT0;
      if (cyc>=120000){ st.cycles++; st.cycleT0=now; st.alarmUntil=now+6000; tone(1046,.2,.3); setTimeout(()=>tone(1046,.2,.3),260); setTimeout(()=>tone(1318,.35,.3),520) }
      $('s-time').textContent=fmt(st.elapsed + now-st.t0); $('s-cyc').textContent=fmt(now-st.cycleT0); $('s-n').textContent=st.cycles;
    }
    $('alarm').hidden = !(now<st.alarmUntil);
  }
  st.elapsed=0;
  async function start(){
    try{ st.ctx = st.ctx || new (window.AudioContext||window.webkitAudioContext)(); if(st.ctx.state==='suspended') await st.ctx.resume() }catch(e){}
    try{ if(navigator.wakeLock) st.wake = await navigator.wakeLock.request('screen') }catch(e){}
    const now=performance.now();
    if(!st.cycleT0 || !st.paused){ st.cycleT0=now } else { st.cycleT0 = now-(st.pausedCyc||0) }
    st.t0=now; st.running=true; st.paused=false; st.breathT=now; st.nextBeat=now;
    $('go').textContent='השהה';
    if (st.phase==='breath'){ st.phase='comp'; st.n=0 }
    beat();
  }
  function pause(){
    const now=performance.now();
    st.running=false; clearTimeout(st.to); st.elapsed += now-st.t0; st.paused=true; st.pausedCyc = now-st.cycleT0;
    $('go').textContent='המשך'; try{ st.wake && st.wake.release() }catch(e){} paint();
  }
  function reset(){ pause(); Object.assign(st,{n:0,phase:'comp',cycles:0,total:0,elapsed:0,cycleT0:0,paused:false,alarmUntil:0});
    $('go').textContent='התחל'; $('s-time').textContent='0:00'; $('s-cyc').textContent='0:00'; $('s-n').textContent='0'; paint() }
  $('go').onclick = ()=> st.running? pause() : start();
  $('reset').onclick = reset;
  $('mode').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st.mode=b.dataset.m; store.set('mode',st.mode);
    $('mode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); st.n=0; st.phase='comp'; paint() });
  $('bpm').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st.bpm=+b.dataset.b; store.set('bpm',st.bpm);
    $('bpm').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)) });
  st.clock = setInterval(clock, 250);
  paint();
  cleanup = ()=>{ st.running=false; clearTimeout(st.to); clearInterval(st.clock); try{st.wake&&st.wake.release()}catch(e){} try{st.ctx&&st.ctx.close()}catch(e){} };
}
