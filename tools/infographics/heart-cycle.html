<!doctype html>
<meta charset="utf-8">
<!-- One frame of the cardiac-cycle animation. Rendered by tools/infographics/heart-cycle.js with ?i=<frame>&n=<count>&img=<heart png>
     Heart footage: "Cardiac Cycle Animated" from Wikimedia Commons (CC BY-SA 4.0), cropped. -->
<style>
*{margin:0;box-sizing:border-box}
body{width:720px;height:720px;background:#fff;font-family:-apple-system,"SF Hebrew","Arial Hebrew",Arial,sans-serif;direction:rtl;overflow:hidden}
.card{position:absolute;inset:14px;border-radius:30px;background:#fff7f1;border:3px solid #f5d2bb}
h1{position:absolute;top:30px;right:40px;left:40px;font-size:34px;font-weight:900}
#sub{position:absolute;top:78px;right:40px;left:40px;font-size:21px;font-weight:600;color:#7a5a48;line-height:1.35}
.heart{position:absolute;top:150px;left:40px;width:370px;height:400px;border-radius:24px;background:#000 center/cover no-repeat}
#side{position:absolute;top:150px;right:40px;width:245px;display:flex;flex-direction:column;gap:12px}
.pill{border-radius:14px;padding:10px 12px;font-size:17px;font-weight:700;line-height:1.3}
.pill b{display:block;font-size:19px}
.op{background:#dcfce7;color:#15803d}.cl{background:#fee2e2;color:#b91c1c}
.flow{background:#eef2ff;color:#3730a3}
.bar{position:absolute;bottom:52px;left:40px;right:40px;height:46px;display:flex;border-radius:14px;overflow:hidden;direction:ltr;font-size:17px;font-weight:800}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff}
#mk{position:absolute;bottom:44px;width:6px;height:62px;border-radius:3px;background:#2a1a10}
.credit{position:absolute;bottom:22px;left:40px;font-size:11px;color:#a08878;direction:ltr}
</style>
<div class="card"></div>
<h1 id="title"></h1>
<div id="sub"></div>
<div class="heart" id="heart"></div>
<div id="side"></div>
<div class="bar">
  <div style="width:44%;background:#3b82f6">דיאסטולה: מילוי</div>
  <div style="width:16%;background:#6366f1">עליות</div>
  <div style="width:40%;background:#dc2626">סיסטולה: פליטה</div>
</div>
<div id="mk"></div>
<div class="credit">Heart animation: Wikimedia Commons, CC BY-SA 4.0</div>
<script>
const q = new URLSearchParams(location.search);
const i = +q.get('i'), n = +q.get('n');
// Frame order (see heart-cycle.js): 0–10 ventricular diastole, 11–14 atrial contraction, 15–24 ventricular systole.
const dia = i < 11, atr = i >= 11 && i < 15, sys = i >= 15;
const T = document.getElementById('title');
T.textContent = sys ? 'סיסטולה: החדרים מתכווצים' : atr ? 'סוף דיאסטולה: העליות מתכווצות' : 'דיאסטולה: החדרים נרפים ומתמלאים';
T.style.color = sys ? '#b91c1c' : atr ? '#4338ca' : '#1d4ed8';
document.getElementById('sub').textContent = sys
  ? 'הלב מתכווץ ודוחף דם החוצה: מהחדר השמאלי לגוף ומהחדר הימני לריאות.'
  : atr ? 'העליות דוחפות עוד מעט דם לחדרים ומשלימות את המילוי, רגע לפני הכיווץ.'
  : 'שריר הלב נרפה, והדם זורם מהעליות אל החדרים וממלא אותם.';
document.getElementById('heart').style.backgroundImage = `url("${q.get('img')}")`;
const avOpen = !sys, slOpen = sys;
document.getElementById('side').innerHTML =
  `<div class="pill ${avOpen ? 'op' : 'cl'}"><b>מסתמים בין העליות לחדרים</b>תלת-צניפי ודו-צניפי: ${avOpen ? 'פתוחים' : 'סגורים'}</div>`
  + `<div class="pill ${slOpen ? 'op' : 'cl'}"><b>מסתמים ביציאה מהחדרים</b>ריאתי ואבי העורקים: ${slOpen ? 'פתוחים' : 'סגורים'}</div>`
  + `<div class="pill flow"><b>לאן זורם הדם</b>${sys ? 'מהחדרים לאבי העורקים ולעורק הריאה' : 'מהוורידים לעליות, ומשם לחדרים'}</div>`;
document.getElementById('mk').style.left = (40 + (i + .5) / n * 640 - 3) + 'px';
</script>
