<!doctype html>
<meta charset="utf-8">
<!-- One frame of the cardiac-cycle animation. Rendered by tools/infographics/heart-cycle.js with ?t=0..1 -->
<style>
*{margin:0;box-sizing:border-box}
body{width:720px;height:720px;background:#fff;font-family:-apple-system,"SF Hebrew","Arial Hebrew",Arial,sans-serif;direction:rtl;overflow:hidden}
.card{position:absolute;inset:14px;border-radius:30px;background:#fff7f1;border:3px solid #f5d2bb}
h1{position:absolute;top:30px;right:40px;left:40px;font-size:36px;font-weight:900;color:#c2410c}
#sub{position:absolute;top:78px;right:40px;left:40px;font-size:22px;font-weight:600;color:#7a5a48;line-height:1.35;min-height:60px}
svg{position:absolute;top:142px;left:60px}
#legend{position:absolute;bottom:92px;left:40px;right:40px;display:flex;flex-direction:column;gap:6px;font-size:17px;font-weight:700}
#legend span{border-radius:10px;padding:5px 12px}#legend .op{background:#dcfce7;color:#15803d}#legend .cl{background:#fee2e2;color:#b91c1c}
.bar{position:absolute;bottom:34px;left:40px;right:40px;height:46px;display:flex;border-radius:14px;overflow:hidden;direction:ltr;font-size:17px;font-weight:800}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff}
#mk{position:absolute;bottom:26px;width:6px;height:62px;border-radius:3px;background:#2a1a10}
.lbl{font-size:15px;font-weight:700;fill:#3f2a1e}
.vl{font-size:13px;font-weight:700}
</style>
<div class="card"></div>
<h1 id="title"></h1>
<div id="sub"></div>
<svg id="s" width="600" height="400" viewBox="0 0 600 400"></svg>
<div id="legend"></div>
<div class="bar">
  <div style="width:45%;background:#3b82f6">דיאסטולה: מילוי</div>
  <div style="width:15%;background:#6366f1">עליות</div>
  <div style="width:40%;background:#dc2626">סיסטולה: פליטה</div>
</div>
<div id="mk"></div>
<script>
const t = +(new URLSearchParams(location.search).get('t') || 0);
const BLUE = '#3B82F6', RED = '#DC2626';
// Phases: 0–.45 ventricular diastole (filling), .45–.60 atrial contraction, .60–1 ventricular systole.
const dia = t < .45, atr = t >= .45 && t < .6, sys = t >= .6;
const ease = x => .5 - .5 * Math.cos(Math.PI * Math.min(1, Math.max(0, x)));
const vSq = sys ? ease((t - .6) / .18) * (1 - ease((t - .9) / .1)) : 0;         // ventricle squeeze 0..1
const aSq = atr ? ease((t - .45) / .07) * (1 - ease((t - .55) / .05)) : 0;       // atrium squeeze 0..1
const avOpen = !sys, slOpen = sys && t < .93;

document.getElementById('title').textContent = sys ? 'סיסטולה: החדרים מתכווצים' : atr ? 'סוף דיאסטולה: העליות מתכווצות' : 'דיאסטולה: החדרים נרפים ומתמלאים';
document.getElementById('sub').textContent = sys
  ? 'המסתמים בין העליות לחדרים נסגרים. המסתמים לעורקים נפתחים, והדם יוצא לאבי העורקים ולעורק הריאה.'
  : atr ? 'העליות דוחפות עוד דם לחדרים ומשלימות את המילוי, רגע לפני שהחדרים מתכווצים.'
  : 'המסתמים בין העליות לחדרים פתוחים, והדם זורם מהעליות לחדרים. המסתמים לעורקים סגורים.';
document.getElementById('mk').style.left = (40 + t * 640 - 3) + 'px';

const s = document.getElementById('s');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent = s) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e }
function chamber(cx, cy, w, h, sq, color, label, ventricle) {
  const g = el('g', { transform: `translate(${cx} ${cy}) scale(${1 - sq * .16} ${1 - sq * (ventricle ? .2 : .14)}) translate(${-cx} ${-cy})` });
  el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: ventricle ? 46 : 34, fill: color, 'fill-opacity': .22, stroke: color, 'stroke-width': ventricle ? 12 + sq * 6 : 7 }, g);
  el('text', { x: cx, y: cy + 5, 'text-anchor': 'middle', class: 'lbl' }, g).textContent = label;
}
// Vessels (behind). Patient's right is on the viewer's left.
const tube = (d, c, w) => el('path', { d, stroke: c, 'stroke-width': w, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
const SVC = 'M110 0 V60', IVC = 'M18 400 V125 C18 100 28 95 45 95', PV = 'M600 70 L515 92';
const PA = 'M230 215 V40 C230 18 215 8 190 4', AO = 'M330 215 V45 C330 16 350 10 385 10 L545 10 C575 10 586 28 586 58 V400';
tube(SVC, BLUE, 26); tube(IVC, BLUE, 24); tube(PV, RED, 20); tube(PA, BLUE, 24); tube(AO, RED, 26);
const vl = (x, y, txt, c) => { el('text', { x, y, 'text-anchor': 'middle', class: 'vl', fill: c }).textContent = txt };
vl(160, 22, 'לריאות', BLUE); vl(545, 395, 'לגוף', RED); vl(560, 105, 'מהריאות', RED); vl(62, 22, 'מהגוף', BLUE);

chamber(122, 95, 160, 110, aSq, BLUE, 'עלייה ימין', false);
chamber(440, 95, 160, 110, aSq, RED, 'עלייה שמאל', false);
chamber(140, 295, 200, 180, vSq, BLUE, 'חדר ימין', true);
chamber(420, 295, 220, 180, vSq, RED, 'חדר שמאל', true);

// Valve glyphs: green and open, or red and shut.
function valve(x, y, open, av) {
  const c = open ? '#16a34a' : '#b91c1c', w = av ? 7 : 6, a = av ? 26 : 13;
  const L = (x1, y1, x2, y2) => el('line', { x1, y1, x2, y2, stroke: c, 'stroke-width': w, 'stroke-linecap': 'round' });
  if (av) { if (open) { L(x - a, y, x - a + 6, y + 24); L(x + a, y, x + a - 6, y + 24) } else { L(x - a, y + 6, x - 2, y + 12); L(x + a, y + 6, x + 2, y + 12) } }
  else { if (open) { L(x - a, y, x - a - 4, y - 20); L(x + a, y, x + a + 4, y - 20) } else { L(x - a, y, x, y - 7); L(x + a, y, x, y - 7) } }
}
valve(122, 162, avOpen, true);
valve(440, 162, avOpen, true);
valve(230, 200, slOpen, false);
valve(330, 200, slOpen, false);

// Moving blood: dots along the paths that carry flow in this phase.
function dots(d, color, n, speed) {
  const p = el('path', { d, fill: 'none', stroke: 'none' });
  const L = p.getTotalLength();
  for (let i = 0; i < n; i++) {
    const f = ((i / n) + t * speed) % 1, pt = p.getPointAtLength(f * L);
    el('circle', { cx: pt.x, cy: pt.y, r: 7, fill: color, stroke: '#fff', 'stroke-width': 2 });
  }
}
dots('M110 0 V80', BLUE, 2, 2);
dots(IVC, BLUE, 4, 2);
dots('M600 70 L480 100', RED, 2, 2);
if (!sys) { dots('M122 120 V290', BLUE, 3, 3); dots('M440 120 V290', RED, 3, 3) }
if (sys && slOpen) { dots('M170 320 C215 290 230 250 ' + PA.slice(1), BLUE, 5, 4); dots('M390 320 C345 290 330 250 ' + AO.slice(1), RED, 7, 4) }

const lg = document.getElementById('legend');
lg.innerHTML = `<span class="${avOpen ? 'op' : 'cl'}">תלת-צניפי ודו-צניפי (עליות ← חדרים): ${avOpen ? 'פתוחים' : 'סגורים'}</span>`
  + `<span class="${slOpen ? 'op' : 'cl'}">ריאתי ואבי העורקים (חדרים ← עורקים): ${slOpen ? 'פתוחים' : 'סגורים'}</span>`;
</script>
